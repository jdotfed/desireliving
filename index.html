<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DESIRE LIVING — 02K Grunge Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=JetBrains+Mono:wght@400;500;700&family=Archivo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0a0a;
    --void-2:#141414;
    --void-3:#1c1c1c;
    --steel:#8f9297;
    --steel-dim:#57595c;
    --bone:#eceef0;
    --ice:#c7d3de;
    --line: rgba(236,238,240,0.14);
    --chrome-grad: linear-gradient(180deg, #ffffff 0%, #d7dade 22%, #6c6f73 48%, #f5f6f7 62%, #8a8d90 78%, #f0f1f2 100%);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    background:var(--void);
    color:var(--bone);
    font-family:'Archivo', sans-serif;
    overflow-x:hidden;
    min-height:100vh;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  .grain{
    position:fixed; inset:0; z-index:999; pointer-events:none;
    opacity:0.05; mix-blend-mode:overlay;
  }

  a, button{font-family:inherit; color:inherit;}

  .chrome-text{
    background:var(--chrome-grad);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,0.9)) drop-shadow(0 0 22px rgba(200,210,220,0.12));
  }

  /* ============ GATE ============ */
  #gate{
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse 120% 80% at 50% 0%, #1e1e1f 0%, var(--void) 55%);
    text-align:center;
    transition: transform 0.9s cubic-bezier(.76,0,.24,1), opacity 0.7s ease 0.15s;
  }

  #gate.torn{
    transform: translateY(-100%);
    opacity:0;
    pointer-events:none;
  }

  .gate-line{
    position:absolute; left:0; right:0; height:1px;
    background: linear-gradient(90deg, transparent, var(--steel) 50%, transparent);
  }
  .gate-line.top{top:12%;}
  .gate-line.bottom{bottom:12%;}

  .gate-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.35em; text-transform:uppercase;
    color:var(--steel-dim); margin-bottom:22px;
  }
  .gate-eyebrow span{color:var(--ice);}

  .gate-title{
    font-family:'Metal Mania', cursive;
    font-size:clamp(56px, 13vw, 148px);
    line-height:0.92;
    letter-spacing:0.01em;
    text-transform:uppercase;
  }

  .gate-logo{
    width:clamp(140px, 20vw, 240px);
    height:auto;
    filter: drop-shadow(0 0 30px rgba(200,210,220,0.12));
  }
  .gate-sub{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:0.25em; text-transform:uppercase;
    color:var(--steel-dim); margin-top:20px;
  }

  .enter-btn{
    margin-top:52px;
    position:relative;
    padding:16px 46px;
    background:var(--void-2);
    border:1px solid var(--steel);
    color:var(--bone);
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    cursor:pointer;
    transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .enter-btn:hover{
    background:var(--chrome-grad);
    border-color:var(--bone);
    color:var(--void);
    transform: translateY(-2px);
    box-shadow:0 10px 26px rgba(200,210,220,0.15);
  }
  .enter-btn:active{ transform: translateY(1px); }
  .enter-btn:focus-visible{ outline:2px solid var(--ice); outline-offset:4px; }

  .gate-hint{
    margin-top:20px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--steel-dim);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:0.4;} 50%{opacity:1;} }

  /* ---- password panel ---- */
  .pw-panel{
    margin-top:52px;
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    max-height:0;
    overflow:hidden;
    transition: opacity 0.35s ease, max-height 0.35s ease;
  }
  .pw-panel.open{
    opacity:1;
    max-height:220px;
  }
  .pw-row{
    display:flex;
    gap:0;
    border:1px solid var(--steel);
  }
  .pw-row.shake{ animation: shake 0.4s ease; border-color:#c0392b; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-6px); }
    40%{ transform:translateX(6px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(4px); }
  }
  .pw-input{
    background:var(--void-2);
    border:none;
    outline:none;
    color:var(--bone);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    letter-spacing:0.2em;
    padding:14px 16px;
    width:200px;
  }
  .pw-input::placeholder{ color:var(--steel-dim); letter-spacing:0.15em; }
  .pw-submit{
    background:var(--chrome-grad);
    border:none;
    color:var(--void);
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    padding:0 20px;
    cursor:pointer;
    transition: filter 0.2s ease;
  }
  .pw-submit:hover{ filter:brightness(1.1); }
  .pw-submit:focus-visible, .pw-input:focus-visible{ outline:2px solid var(--ice); outline-offset:2px; }
  .pw-error{
    margin-top:14px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px; letter-spacing:0.15em; text-transform:uppercase;
    color:#c0392b;
    height:14px;
  }
  .pw-back{
    margin-top:16px;
    background:none;
    border:none;
    color:var(--steel-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:10px; letter-spacing:0.15em; text-transform:uppercase;
    cursor:pointer;
    text-decoration:underline;
  }

  /* ============ SHOP ============ */
  #shop{ min-height:100vh; }

  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:20px clamp(20px,4vw,48px);
    background:rgba(10,10,10,0.88);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .brand-mark{
    font-family:'Metal Mania', cursive;
    font-size:24px; letter-spacing:0.02em;
    text-transform:uppercase;
  }
  .topbar-right{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.15em; text-transform:uppercase;
    color:var(--steel-dim);
  }

  .chrome-strip{
    height:3px;
    background:var(--chrome-grad);
  }

  .shop-head{
    padding:56px clamp(20px,4vw,48px) 28px;
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:20px;
    border-bottom:1px solid var(--line);
  }
  .shop-head h1{
    font-family:'Metal Mania', cursive;
    font-size:clamp(34px,5.5vw,64px);
    text-transform:uppercase; line-height:0.95; font-weight:400;
  }
  .shop-head p{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; color:var(--steel-dim); letter-spacing:0.08em;
    max-width:360px; margin-top:12px;
  }
  .drop-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:0.2em; text-transform:uppercase;
    border:1px solid var(--line); padding:8px 14px; color:var(--steel-dim);
    white-space:nowrap;
  }
  .drop-tag b{color:var(--ice);}

  /* ---- single product feature ---- */
  .feature{
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--void-2);
    padding:clamp(24px,5vw,64px);
  }

  .feature img{
    width:100%;
    max-width:1100px;
    height:auto;
    object-fit:contain;
    filter: contrast(1.04) saturate(0.96);
  }

  footer{
    padding:40px clamp(20px,4vw,48px) 60px;
    display:flex; flex-wrap:wrap; justify-content:space-between; gap:20px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.1em; color:var(--steel-dim);
  }
  footer .fmark{ color:var(--steel); }
</style>
</head>
<body>

<svg class="grain" xmlns="http://www.w3.org/2000/svg">
  <filter id="noiseFilter">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
</svg>

<!-- ============ GATE ============ -->
<div id="gate">
  <div class="gate-line top"></div>
  <div class="gate-eyebrow">Restricted Access <span>/</span> 02K Grunge Collection</div>
  <img class="gate-logo" src="https://cdn.discordapp.com/attachments/1540060798947164190/1542290704301035530/D53DD88E-5A89-4D1A-8225-D3BD94DD5FA9.png?ex=6a90b1a6&is=6a8f6026&hm=8084c4041f204a8dc029877b8d843496387d27aeef511ac88b9172debac74b56&">
  <div class="gate-sub">Made to Desire</div>
  <button class="enter-btn" id="enterBtn">unlock →</button>

  <div class="pw-panel" id="pwPanel">
    <div class="pw-row" id="pwRow">
      <input class="pw-input" id="pwInput" type="password" placeholder="password" autocomplete="off">
      <button class="pw-submit" id="pwSubmit">Go</button>
    </div>
    <div class="pw-error" id="pwError"></div>
    <button class="pw-back" id="pwBack">back</button>
  </div>

  <div class="gate-hint"> </div>
  <div class="gate-line bottom"></div>
</div>

<!-- ============ SHOP ============ -->
<div id="shop">
  <div class="chrome-strip"></div>
  <div class="topbar">
    <div class="brand-mark chrome-text">Desire Living</div>
    <div class="topbar-right">Lot 001 — Cart (0)</div>
  </div>

  <div class="shop-head">
    <h1 class="chrome-text">Test</h1>
    <div class="drop-tag">Drop <b>001</b> — 01 pc</div>
  </div>

  <div class="feature">
    <img src="https://media.discordapp.net/attachments/1540060830291202158/1540063981006360586/CE4F7360-402B-416A-A9F7-CF2C27CF24E0.png?ex=6a9080da&is=6a8f2f5a&hm=99bb9f4ff38de5bc8a597ef31fd95afab80467a3dbdc90b96a0ec4f5a4b3df8c&=&format=webp&quality=lossless&width=1280&height=1024" alt="Desire Living oversized graphic tee mockup, front and back, Y2K grunge collection">
  </div>

  <footer>
    <div class="fmark">DESIRE LIVING — TEST BUILD</div>
    <div>Made to Desire.</div>
  </footer>
</div>

<script>
  // ---- change this to set your site password ----
  const SITE_PASSWORD = "desire";

  const gate = document.getElementById('gate');
  const enterBtn = document.getElementById('enterBtn');
  const pwPanel = document.getElementById('pwPanel');
  const pwRow = document.getElementById('pwRow');
  const pwInput = document.getElementById('pwInput');
  const pwSubmit = document.getElementById('pwSubmit');
  const pwError = document.getElementById('pwError');
  const pwBack = document.getElementById('pwBack');

  function unlockSite(){
    gate.classList.add('torn');
    setTimeout(() => { gate.style.display = 'none'; }, 950);
  }

  function showPwPanel(){
    enterBtn.style.display = 'none';
    pwPanel.classList.add('open');
    setTimeout(() => pwInput.focus(), 150);
  }

  function hidePwPanel(){
    pwPanel.classList.remove('open');
    pwError.textContent = '';
    pwInput.value = '';
    enterBtn.style.display = 'inline-block';
  }

  function checkPassword(){
    if(pwInput.value.trim().toLowerCase() === SITE_PASSWORD.toLowerCase()){
      unlockSite();
    } else {
      pwError.textContent = 'incorrect password';
      pwRow.classList.remove('shake');
      void pwRow.offsetWidth;
      pwRow.classList.add('shake');
      pwInput.value = '';
      pwInput.focus();
    }
  }

  enterBtn.addEventListener('click', showPwPanel);
  pwSubmit.addEventListener('click', checkPassword);
  pwBack.addEventListener('click', hidePwPanel);
  pwInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') checkPassword();
  });
</script>

</body>
</html>
